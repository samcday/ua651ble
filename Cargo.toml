[package]
name = "ua651ble"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Pair with and receive measurements from an A&D UA-651BLE through BlueZ"

[dependencies]
anyhow = "1"
bluer = { git = "https://github.com/samcday/bluer", rev = "b3e6f89842da0da0f515f6da3c6c65d06031373b", features = ["bluetoothd"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
